openapi: 3.1.0
info:
  title: File Upload Service
  version: 1.0.0-mvp
  description: >
    MVP backend for private per-user file uploads. Bytes are uploaded directly
    to object storage via presigned URLs; this service stores only metadata.
    See SPEC.md for behavior, invariants, and acceptance tests.

servers:
  - url: https://api.example.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: files
    description: Upload, list, download, and delete operations.

paths:
  /files:
    post:
      tags: [files]
      operationId: requestUpload
      summary: Request an upload
      description: >
        Creates a `pending` file record and returns a presigned URL for the
        client to PUT the bytes directly to object storage. Enforces the daily
        quota (10 files / rolling 24h) and the 100 MB size cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Upload authorized; presigned URL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid body or size greater than 100 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Daily quota exceeded (10 files per rolling 24h window).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [files]
      operationId: listFiles
      summary: List own files
      description: Returns the caller's `complete` files. `pending` files are excluded.
      responses:
        '200':
          description: List of the caller's files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /files/{fileId}/complete:
    post:
      tags: [files]
      operationId: completeUpload
      summary: Finalize an upload
      description: >
        Marks the upload `complete` after the bytes are in object storage.
        Idempotent — completing an already-complete file returns 200.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File marked complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{fileId}/download:
    get:
      tags: [files]
      operationId: getDownloadUrl
      summary: Get a download URL
      description: >
        Returns a freshly minted presigned GET URL for the file. Only the owner
        may call this, and only for `complete` files.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Presigned download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{fileId}:
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file
      description: Removes the object from storage and the metadata row. Owner only.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      description: Stable file identifier.
      schema:
        type: string
        example: f_abc123

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >
        File does not exist, is not owned by the caller, or is still `pending`.
        Returned as 404 (not 403) to avoid leaking existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    UploadRequest:
      type: object
      required: [filename, size]
      properties:
        filename:
          type: string
          description: Client-supplied display name.
          example: report.zip
        size:
          type: integer
          format: int64
          description: File size in bytes. Must not exceed 100 MB.
          minimum: 1
          maximum: 104857600
          example: 104857600

    UploadResponse:
      type: object
      required: [file_id, upload_url]
      properties:
        file_id:
          type: string
          example: f_abc123
        upload_url:
          type: string
          format: uri
          description: >
            Presigned PUT URL for direct upload to object storage. Time-limited
            and scoped to a 100 MB content-length range. Never persisted.
          example: https://bucket.s3.amazonaws.com/u_42/f_abc123?X-Amz-Signature=...

    DownloadResponse:
      type: object
      required: [download_url]
      properties:
        download_url:
          type: string
          format: uri
          description: Presigned GET URL, freshly minted per request.
          example: https://bucket.s3.amazonaws.com/u_42/f_abc123?X-Amz-Signature=...

    File:
      type: object
      required: [file_id, filename, size, status, created_at]
      properties:
        file_id:
          type: string
          example: f_abc123
        filename:
          type: string
          example: report.zip
        size:
          type: integer
          format: int64
          example: 104857600
        status:
          type: string
          enum: [pending, complete]
          example: complete
        created_at:
          type: string
          format: date-time
          example: '2026-08-06T12:00:00Z'

    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.
          example: quota_exceeded
        message:
          type: string
          description: Human-readable detail.
          example: Daily upload limit of 10 files reached.
